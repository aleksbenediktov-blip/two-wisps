<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Два огонька</title>
<style>
:root{color-scheme:dark;--bg:#0c0e1a;--fg:#e9e6f5;--mut:#8f93b0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
canvas{max-width:100%;height:auto;border-radius:6px;box-shadow:0 0 40px rgba(140,110,255,.15)}
button,input{font:inherit;font-size:14px;background:#1c1f38;color:var(--fg);border:1px solid #3a3f6c;border-radius:4px;padding:3px 8px}
p{margin:0;color:var(--mut);font-size:15px;text-align:center;padding:0 12px}

/* ---------- Мобильное управление ---------- */
body{box-sizing:border-box;overscroll-behavior:none}
#stage{display:contents}
.pad,#tb,#rot{display:none}
body.touch{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body.touch button{font-size:16px;padding:8px 12px}
body.touch #stage{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"cv cv" "pl pr";gap:12px 8px;width:100%;box-sizing:border-box;align-items:end;
 padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));--bs:clamp(46px,15vw,66px)}
body.touch canvas{grid-area:cv;width:100%;justify-self:center;align-self:center}
body.touch #padL{grid-area:pl;justify-self:start}
body.touch #padR{grid-area:pr;justify-self:end}
body.touch .pad{display:grid;grid-template-columns:repeat(2,var(--bs));gap:6px;touch-action:none}
body.touch .pad button{width:var(--bs);height:var(--bs);padding:0;border-radius:14px;background:rgba(40,44,86,.7);border:2px solid #4b5090;color:var(--fg);
 display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent}
body.touch .pad.pb button{border-color:#a98bff}
body.touch .pad.pw button{border-color:#ffe9a0}
body.touch .pad button.on{background:rgba(160,130,255,.75);transform:scale(.94)}
body.touch .pad.pw button.on{background:rgba(255,233,160,.55)}
body.touch .pad button.wide{grid-column:span 2;width:100%}
body.touch .pad button.lv{font-size:12px;line-height:1.1}
body.touch .kbd{display:none}
body.touch #rot{display:block}
body.touch #tb{display:flex;gap:6px;position:fixed;z-index:20;top:max(6px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right))}
body.touch #tb button{width:42px;height:42px;padding:0;font-size:20px;border-radius:10px;background:rgba(28,31,56,.85)}
@media (orientation:landscape){
 body.touch #rot{display:none}
 body.touch #stage{grid-template-columns:auto 1fr auto;grid-template-areas:"pl cv pr";height:100%;gap:6px;--bs:clamp(42px,13vh,60px)}
 body.touch canvas{width:min(100%,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*1.7647));
  width:min(100%,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*1.7647))}
 body.touch .pad{align-self:end;margin-bottom:6px}
}
</style>
</head>
<body>
<div id="tb"><button id="rs" type="button" title="Начать уровень заново">↺</button></div>
<div id="stage">
<div class="pad" id="padL"></div>
<canvas id="c"></canvas>
<div class="pad" id="padR"></div>
</div>
<p id="rot">Поверните телефон горизонтально — так играть удобнее.</p>
<p class="kbd">Чёрный: A / D — ходить, W — прыжок, S — рычаг &nbsp;·&nbsp; Белый: ← / → — ходить, ↑ — прыжок &nbsp;·&nbsp; R — начать уровень заново</p>

 L('Первые шаги','Оба огонька должны дойти до своих выходов.',0,{

 L('Движущаяся платформа','Рычаг запускает платформу. Прыгайте на неё вместе и не падайте на шипы.',0,{15:'.1.2l.'+'^'.repeat(19)+'.a.b'},{mov:[{c:7,r:13,w:3,dx:15,dy:0,sw:1}]}),

];

 mkLv('Два огонька','Финал. В темноте: коробка с уступа на кнопку, рычаг и лифт, лёд с шипом, хрупкая плита с шипом и пружина под потолок. Дождь сверху.',1,m=>{
  put(m,1,15,'1');put(m,2,15,'2');
  rect(m,3,14,6,15,'#');put(m,5,13,'o');put(m,7,15,'k');
  rect(m,9,1,9,11,'#');rect(m,9,12,9,15,'G');
  put(m,11,15,'l');
  rect(m,16,15,28,15,'^');
  rect(m,16,8,18,8,'i');put(m,17,7,'^');
  rect(m,19,8,20,8,'c');put(m,20,7,'^');rect(m,21,8,21,8,'#');put(m,21,7,'s');
  rect(m,24,3,28,4,'#');put(m,26,2,'a');put(m,27,2,'b');
 },{mov:[{c:13,r:15,w:3,dx:0,dy:-8,sw:1}],em:[{c:5,r:1,p:110,o:0},{c:12,r:1,p:100,o:40},{c:17,r:1,p:100,o:20},{c:20,r:1,p:90,o:60}]})
);
let lv=0,g,B,Wp,cs={},gateOpen=false,wait=0,fin=false,t0=0,lever=false,sPrev=false,boxes=[],plats=[],ems=[],drops=[],fc=0;
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(e.code==='KeyR'&&!fin)load(lv);});
addEventListener('keyup',e=>keys[e.code]=false);

const mk=(x,y,black)=>({x,y,w:20,h:20,vx:0,vy:0,g:false,black});
function load(n){
 lv=n;wait=0;lever=false;boxes=[];cs={};ems=LV[n].ex.em||[];drops=[];fc=0;plats=(LV[n].ex.mov||[]).map(m=>({x:m.c*T,y:m.r*T,w:m.w*T,h:14,ax:m.c*T,ay:m.r*T,bx:(m.c+m.dx)*T,by:(m.r+m.dy)*T,t:0,dir:1,sw:!!m.sw}));
 g=LV[n].rows.map(r=>r.padEnd(W,'.').slice(0,W).split(''));
 for(let r=0;r<H;r++)for(let c=0;c<W;c++){
  if(r===0||r===H-1||c===0||c===W-1)g[r][c]='#';
  const ch=g[r][c];
  if(ch==='1'){B=mk(c*T+6,r*T+T-20,true);g[r][c]='.';}
  if(ch==='2'){Wp=mk(c*T+6,r*T+T-20,false);g[r][c]='.';}
  if(ch==='o'){boxes.push({x:c*T,y:r*T,w:T,h:T,vx:0,vy:0,g:false,box:1});g[r][c]='.';}
 }
}
function lit(c,r){
 const dx=(c+.5)*T-(Wp.x+10),dy=(r+.5)*T-(Wp.y+10);
 return dx*dx+dy*dy<R*R;
}
function solid(c,r,p){
 const t=g[r]&&g[r][c];
 if(t==='#'||t==='i')return true;
 if(t==='c')return (cs[r*W+c]||0)<50;
 if(t==='x')return !p.black;
 if(t==='G')return !gateOpen;
 if(t==='g')return !lever;
 if(t==='h')return lit(c,r);
 return false;
}
function collide(p,hx){
 const x0=Math.floor(p.x/T),x1=Math.floor((p.x+p.w-.01)/T),y0=Math.floor(p.y/T),y1=Math.floor((p.y+p.h-.01)/T);
 for(let r=y0;r<=y1;r++)for(let c=x0;c<=x1;c++){
  if(!solid(c,r,p))continue;
  if(hx){if(p.vx>0)p.x=c*T-p.w;else if(p.vx<0)p.x=(c+1)*T;p.vx=0;}
  else{if(p.vy>0){p.y=r*T-p.h;p.g=true;}else if(p.vy<0)p.y=(r+1)*T;p.vy=0;}
 }
}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function move(p){
 const o=plats.concat(boxes.filter(b=>b!==p));
 p.x+=p.vx;collide(p,true);
 for(const e of o)if(hit(p,e)){
  if(e.box&&!p.box&&p.vx){const x0=e.x;e.x+=p.vx;e.vx=p.vx;collide(e,true);e.vx=0;
   if(o.some(f=>f!==e&&f.box&&hit(e,f))||hit(e,B===p?Wp:B))e.x=x0;}
  if(hit(p,e))p.x=p.vx>0?e.x-p.w:e.x+e.w;
 }
 p.g=false;p.ride=null;p.y+=p.vy;collide(p,false);
 for(const e of o)if(hit(p,e)){
  if(p.vy>=0){p.y=e.y-p.h;p.g=true;p.vy=0;p.ride=e;}
  else{p.y=e.y+e.h;p.vy=0;}
 }
}
// Ворота закрываются, когда ящик или огонёк стоит в проёме. Раньше физика выталкивала такой
// предмет вверх по всему столбцу ворот и стены (ящик «улетал в небо»). Теперь предмет
// возвращается на последнее место вне ворот — туда, откуда он в них зашёл.
function gateState(p){
 const x0=Math.floor(p.x/T),x1=Math.floor((p.x+p.w-.01)/T),y0=Math.floor(p.y/T),y1=Math.floor((p.y+p.h-.01)/T);
 let any=0,closed=0;
 for(let r=y0;r<=y1;r++)for(let c=x0;c<=x1;c++){
  const t=g[r]&&g[r][c];
  if(t==='G'){any=1;if(!gateOpen)closed=1;}
  else if(t==='g'){any=1;if(!lever)closed=1;}
 }
 return closed?2:any;
}
function gateGuard(list){for(const p of list)if(p.sx!==undefined&&gateState(p)===2){p.x=p.sx;p.y=p.sy;p.vx=0;p.vy=0;}}
function gateMark(list){for(const p of list)if(!gateState(p)){p.sx=p.x;p.sy=p.y;}}
function movePlats(){
 for(const e of plats){
  if(e.sw&&!lever)continue;
  const len=Math.hypot(e.bx-e.ax,e.by-e.ay);
  e.t+=1.3/len*e.dir;
  if(e.t>=1||e.t<=0){e.t=Math.max(0,Math.min(1,e.t));e.dir*=-1;}
  const nx=e.ax+(e.bx-e.ax)*e.t,ny=e.ay+(e.by-e.ay)*e.t,dx=nx-e.x,dy=ny-e.y;
  for(const q of [B,Wp,...boxes])if(q.ride===e){q.x+=dx;q.y+=dy;}
  e.x=nx;e.y=ny;
 }
}
function touches(p,ch){
 const i=ch==='^'?8:0;
 const x0=Math.floor(p.x/T),x1=Math.floor((p.x+p.w-.01)/T),y0=Math.floor(p.y/T),y1=Math.floor((p.y+p.h-.01)/T);
 for(let r=y0;r<=y1;r++)for(let c=x0;c<=x1;c++){
  if(!g[r]||g[r][c]!==ch)continue;
  if(p.x<c*T+T-i&&p.x+p.w>c*T+i&&p.y<r*T+T&&p.y+p.h>r*T+i)return true;
 }
 return false;
}
function onIce(p){
 if(!p.g)return false;
 const r=Math.floor((p.y+p.h+1)/T);
 for(let c=Math.floor(p.x/T);c<=Math.floor((p.x+p.w-.01)/T);c++)if(g[r]&&g[r][c]==='i')return true;
 return false;
}
function ctl(p,l,r,u){
 const d=(keys[r]?1:0)-(keys[l]?1:0);
 p.vx+=(d*3.3-p.vx)*(onIce(p)?.04:.4);
 if(keys[u]&&p.g)p.vy=-10.5;
}
// Падающие шипы: эмиттеры {c,r,p,o} — колонка, строка, период в кадрах, сдвиг.
// За 45 кадров до падения эмиттер краснеет. Шип гибельный для огоньков, исчезает у стены, платформы или коробки.
function rain(){
 fc++;
 for(const e of ems)if((fc+e.o)%e.p===0)drops.push({x:e.c*T+10,y:e.r*T+T,w:12,h:16,vy:0});
 const hp=(p,d)=>p.x<d.x+d.w&&p.x+p.w>d.x&&p.y<d.y+d.h&&p.y+p.h>d.y;
 const nd=[];
 for(const d of drops){
  d.vy=Math.min(d.vy+.35,8);d.y+=d.vy;
  if(hp(B,d)||hp(Wp,d))return true;
  const c=Math.floor((d.x+d.w/2)/T),r=Math.floor((d.y+d.h)/T);
  if(r>=H||solid(c,r,{black:false}))continue;
  if(plats.some(e=>hit(d,e))||boxes.some(b=>hit(d,b)))continue;
  nd.push(d);
 }
 drops=nd;return false;
}
function step(){
 t0++;
 if(wait>0){wait--;if(wait===0){if(lv+1<LV.length)load(lv+1);else fin=true;}return;}
 if(fin)return;
 gateOpen=touches(B,'k')||boxes.some(b=>touches(b,'k'));
 const sk=!!keys.KeyS;if(sk&&!sPrev&&touches(B,'l'))lever=!lever;sPrev=sk;
 gateGuard([B,Wp,...boxes]);
 movePlats();
 ctl(B,'KeyA','KeyD','KeyW');
 ctl(Wp,'ArrowLeft','ArrowRight','ArrowUp');
 for(const p of [B,Wp]){
  if(p.g&&touches(p,'s'))p.vy=-16;
  if(p.g){const r=Math.floor((p.y+p.h+1)/T);for(let c=Math.floor(p.x/T);c<=Math.floor((p.x+p.w-.01)/T);c++)if(g[r]&&g[r][c]==='c'&&!cs[r*W+c])cs[r*W+c]=1;}
 }
 for(const k in cs)if(cs[k]<50)cs[k]++;
 for(const p of [...boxes,B,Wp]){p.vy=Math.min(p.vy+.5,12);move(p);}
 gateMark([...boxes,B,Wp]);
 if(rain()||touches(B,'^')||touches(Wp,'^')){load(lv);return;}
 if(touches(B,'a')&&touches(Wp,'b'))wait=50;
}

function glow(c,x,y,r,a){
 const gr=c.createRadialGradient(x,y,r*.25,x,y,r);
 gr.addColorStop(0,'rgba(0,0,0,'+a+')');gr.addColorStop(1,'rgba(0,0,0,0)');
 c.fillStyle=gr;c.beginPath();c.arc(x,y,r,0,7);c.fill();
}
function ring(x,y,col){
 ctx.strokeStyle=col;ctx.lineWidth=3;
 ctx.beginPath();ctx.arc(x+T/2,y+T/2,11+Math.sin(t0/12)*1.5,0,7);ctx.stroke();
}
function wisp(p){
 const cx=p.x+10,cy=p.y+9+Math.sin(t0/10+(p.black?0:2))*1.2;
 const gr=ctx.createRadialGradient(cx,cy,4,cx,cy,26);
 gr.addColorStop(0,p.black?'rgba(150,110,255,.5)':'rgba(255,248,210,.7)');gr.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=gr;ctx.beginPath();ctx.arc(cx,cy,26,0,7);ctx.fill();
 ctx.fillStyle=p.black?'#07070d':'#fffbea';
 ctx.strokeStyle=p.black?'#a98bff':'#ffe9a0';ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(cx,cy,11,0,7);ctx.fill();ctx.stroke();
 ctx.fillStyle=p.black?'#fffbea':'#201a33';
 ctx.fillRect(cx-5,cy-3,3,5);ctx.fillRect(cx+2,cy-3,3,5);
}
function draw(){
 ctx.fillStyle='#12142a';ctx.fillRect(0,0,cv.width,cv.height);
 for(let r=0;r<H;r++)for(let c=0;c<W;c++){
  const t=g[r][c],x=c*T,y=r*T;
  if(t==='#'){ctx.fillStyle='#2a2d4d';ctx.fillRect(x,y,T,T);ctx.strokeStyle='#3a3f6c';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,T-1,T-1);}
  else if(t==='x'){ctx.fillStyle='rgba(120,70,210,.5)';ctx.fillRect(x,y,T,T);ctx.strokeStyle='#8a5cf0';ctx.strokeRect(x+2,y+2,T-4,T-4);}
  else if(t==='G'){ctx.fillStyle=gateOpen?'rgba(240,170,60,.15)':'#e8a13a';ctx.fillRect(x+9,y,14,T);}
  else if(t==='k'){ctx.fillStyle=gateOpen?'#ffd98a':'#9a6a22';ctx.fillRect(x+4,y+T-8,T-8,8);}
  else if(t==='g'){ctx.fillStyle=lever?'rgba(90,190,255,.15)':'#3fa9e0';ctx.fillRect(x+9,y,14,T);}
  else if(t==='l'){ctx.fillStyle='#6b5a2a';ctx.fillRect(x+8,y+T-6,16,6);ctx.strokeStyle=lever?'#7bd5ff':'#b5b5c5';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+16,y+T-6);ctx.lineTo(x+(lever?26:6),y+8);ctx.stroke();}
  else if(t==='^'){ctx.fillStyle='#e0505f';ctx.beginPath();ctx.moveTo(x+3,y+T);ctx.lineTo(x+T/2,y+8);ctx.lineTo(x+T-3,y+T);ctx.fill();}
  else if(t==='i'){ctx.fillStyle='#9fd8f0';ctx.fillRect(x,y,T,T);ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(x+3,y+3,T-6,4);ctx.strokeStyle='#d8f3ff';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,T-1,T-1);}
  else if(t==='c'){const q=cs[r*W+c]||0;if(q<50){const sh=q>0?Math.sin(q*2)*2:0;ctx.fillStyle=q>0?'#b0623a':'#a07a4a';ctx.fillRect(x+sh,y,T,T);ctx.strokeStyle='#d7b27a';ctx.lineWidth=1;ctx.strokeRect(x+sh+.5,y+.5,T-1,T-1);}}
  else if(t==='s'){ctx.fillStyle='#5a5f8f';ctx.fillRect(x+4,y+T-6,T-8,6);ctx.strokeStyle='#58e08a';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<3;i++){ctx.moveTo(x+8,y+T-8-i*6);ctx.lineTo(x+T-8,y+T-11-i*6);}ctx.stroke();ctx.fillStyle='#58e08a';ctx.fillRect(x+5,y+T-27,T-10,4);}
  else if(t==='a')ring(x,y,'#9d7cff');
  else if(t==='b')ring(x,y,'#fff1b8');
  else if(t==='h'&&lit(c,r)){ctx.fillStyle='rgba(255,243,176,.85)';ctx.fillRect(x,y,T,T);}
 }
 for(const e of plats){ctx.fillStyle='#7d85c9';ctx.fillRect(e.x,e.y,e.w,e.h);}
 for(const b of boxes){ctx.fillStyle='#8a6a3b';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle='#c49a5a';ctx.lineWidth=2;ctx.strokeRect(b.x+2,b.y+2,b.w-4,b.h-4);}
 if(LV[lv].dark){
  dctx.globalCompositeOperation='source-over';
  dctx.fillStyle='rgba(2,3,9,.97)';dctx.fillRect(0,0,dk.width,dk.height);
  dctx.globalCompositeOperation='destination-out';
  glow(dctx,Wp.x+10,Wp.y+10,R,1);glow(dctx,B.x+10,B.y+10,R*.28,.9);
  ctx.drawImage(dk,0,0);
 }
 for(const e of ems){
  const ph=(fc+e.o)%e.p,w=ph>e.p-45?(ph-(e.p-45))/45:0,x=e.c*T,y=e.r*T;
  ctx.fillStyle='#4a4d70';ctx.fillRect(x+6,y,20,10);
  ctx.fillStyle='rgba(255,'+Math.round(110-80*w)+',100,'+(.4+.6*w)+')';
  ctx.beginPath();ctx.moveTo(x+10,y+10);ctx.lineTo(x+22,y+10);ctx.lineTo(x+16,y+18+8*w);ctx.fill();
 }
 for(const d of drops){ctx.fillStyle='#ff5a6a';ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+d.w,d.y);ctx.lineTo(d.x+d.w/2,d.y+d.h);ctx.fill();}
 wisp(B);wisp(Wp);
 ctx.fillStyle='#a8abc8';ctx.font='16px Georgia,serif';ctx.textAlign='left';
 ctx.fillText('Уровень '+(lv+1)+' из '+LV.length+': '+LV[lv].name,40,26);
 if(wait>0||fin){
  ctx.fillStyle='rgba(8,9,20,.7)';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#fff1b8';ctx.font='32px Georgia,serif';ctx.textAlign='center';
  ctx.fillText(fin?'Все уровни пройдены':'Уровень пройден',cv.width/2,cv.height/2);
 }
}
// ===== Сенсорное управление =====
const TOUCH=matchMedia('(pointer:coarse)').matches||/[?&]touch\b/.test(location.search);
const padL=document.getElementById('padL'),padR=document.getElementById('padR');
const ICON={l:'M16 4L6 12l10 8z',r:'M8 4l10 8-10 8z',u:'M4 17l8-11 8 11z'};
const ic=k=>'<svg viewBox="0 0 24 24" width="46%" height="46%" aria-hidden="true"><path d="'+ICON[k]+'" fill="currentColor"/></svg>';
const bt=(code,inner,cls)=>'<button type="button" data-k="'+code+'" class="'+(cls||'')+'">'+inner+'</button>';
const held=new Map(),cnt=new Map();
function prs(b){b.classList.add('on');keys[b.dataset.k]=true;}
function rel(b){b.classList.remove('on');const c=b.dataset.k;
 if(b.dataset.k==='KeyS')setTimeout(()=>{if(!b.classList.contains('on'))keys[c]=false;},90); // рычаг реагирует на нажатие — держим минимум пару кадров
 else keys[c]=false;}
function setBtn(id,b){
 const old=held.get(id);if(old===b)return;
 if(old){const n=(cnt.get(old)||1)-1;cnt.set(old,n);if(!n)rel(old);}
 if(b){held.set(id,b);const n=(cnt.get(b)||0)+1;cnt.set(b,n);if(n===1)prs(b);}else held.delete(id);
}
function releaseAll(){
 held.clear();cnt.clear();
 document.querySelectorAll('.pad button.on').forEach(b=>b.classList.remove('on'));
 for(const k of ['KeyA','KeyD','KeyW','KeyS','ArrowLeft','ArrowRight','ArrowUp'])keys[k]=false;
}
function btnAt(pad,e){const el=document.elementFromPoint(e.clientX,e.clientY);const b=el&&el.closest&&el.closest('button[data-k]');return b&&pad.contains(b)?b:null;}
function bindPad(pad){
 pad.addEventListener('pointerdown',e=>{e.preventDefault();try{pad.setPointerCapture(e.pointerId);}catch(_){}setBtn(e.pointerId,btnAt(pad,e));});
 pad.addEventListener('pointermove',e=>{if(held.has(e.pointerId)||(pad.hasPointerCapture&&pad.hasPointerCapture(e.pointerId)))setBtn(e.pointerId,btnAt(pad,e));});
 const up=e=>setBtn(e.pointerId,null);
 pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);pad.addEventListener('lostpointercapture',up);
 pad.addEventListener('contextmenu',e=>e.preventDefault());
}
function buildPads(){
 if(!TOUCH)return;
 releaseAll();
 // Один телефон на двоих: слева чёрный, справа белый
 const cL='pb',cR='pw';
 const L=bt('KeyS','Рычаг','lv')+bt('KeyW',ic('u'))+bt('KeyA',ic('l'))+bt('KeyD',ic('r'));
 const Rr=bt('ArrowUp',ic('u'),'wide')+bt('ArrowLeft',ic('l'))+bt('ArrowRight',ic('r'));
 padL.className='pad '+cL;padL.innerHTML=L;
 padR.className='pad '+cR;padR.innerHTML=Rr;
}
if(TOUCH){
 document.body.classList.add('touch');
 bindPad(padL);bindPad(padR);buildPads();
 document.getElementById('rs').onclick=()=>{if(!fin)load(lv);};
 addEventListener('blur',releaseAll);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();});
 document.addEventListener('gesturestart',e=>e.preventDefault());
 document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
}

let last=0,acc=0;
function frame(t){acc+=Math.min(t-last,100);last=t;while(acc>=16.67){step();acc-=16.67;}
 draw();requestAnimationFrame(frame);}
load(0);
requestAnimationFrame(t=>{last=t;frame(t);});
</script>
