 L('Движущаяся платформа','Рычаг запускает платформу. Прыгайте на неё вместе и не падайте на шипы.',0,{15:'.1.2l.'+'^'.repeat(19)+'.a.b'},{mov:[{c:7,r:13,w:3,dx:15,dy:0,sw:1}]}),

 ((m)=>{for(let i=1;i<=9;i++)m[i]='.'.repeat(14)+'#';return L('Свет на ступенях','Ступени видны и твёрдые, только пока на них светит белый. Дальше всё как в «Кнопке и тени».',1,m);})({10:'..............x',11:'...........k..x',12:'.........#####G',13:'..............G',14:'......hhh.....G',15:'.1.2..........G..........a.b'}),
 L('Поездка в темноте','Платформа и шипы видны, только пока рядом белый. Дёрните рычаг и держитесь вместе.',1,{15:'.1.2l.'+'^'.repeat(19)+'.a.b'},{mov:[{c:7,r:13,w:3,dx:15,dy:0,sw:1}]})
];

// Новые, более сложные уровни (12–16)
const blank=()=>Array.from({length:H},()=>Array(W).fill('.'));
const rect=(m,c0,r0,c1,r1,ch)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)m[r][c]=ch;};
const put=(m,c,r,ch)=>{m[r][c]=ch;};
const mkLv=(name,hint,dark,build,ex)=>{const m=blank();build(m);return L(name,hint,dark,m.map(r=>r.join('')),ex);};
LV.push(
 mkLv('Падающая коробка','Столкните коробку с уступа на кнопку — она удержит ворота. Потом рычаг запустит обе платформы.',0,m=>{
  put(m,1,15,'1');put(m,2,15,'2');

 },{mov:[{c:15,r:14,w:3,dx:4,dy:0,sw:1},{c:25,r:15,w:2,dx:0,dy:-6,sw:1}]}),
 mkLv('Шов тени','Белый не пройдёт сквозь тень. Чёрный находит обход, дёргает рычаг и открывает ворота. Дальше — мост из света.',1,m=>{

  put(m,13,15,'l');rect(m,15,15,26,15,'^');
  rect(m,16,14,17,14,'h');rect(m,20,13,21,13,'h');rect(m,24,14,25,14,'h');
  put(m,27,15,'a');put(m,28,15,'b');
 }),
 mkLv('Колодец','Рычаг запускает лифт и платформу. Коробку нужно поставить на кнопку на верхнем ярусе, иначе ворота у выхода не откроются.',0,m=>{
  put(m,1,15,'1');put(m,2,15,'2');put(m,4,15,'l');
  rect(m,9,7,14,8,'#');rect(m,22,7,28,8,'#');
  put(m,10,6,'o');put(m,12,6,'k');
  rect(m,15,15,21,15,'^');
  rect(m,24,1,24,4,'#');rect(m,24,5,24,6,'G');

 },{mov:[{c:6,r:15,w:3,dx:0,dy:-8,sw:1},{c:15,r:7,w:3,dx:4,dy:0,sw:1}]}),
 mkLv('Лестница в темноте','На каждой ступени справа шип. Белый ведёт, чёрный идёт следом — не отдаляйтесь друг от друга.',1,m=>{
  put(m,1,15,'1');put(m,2,15,'2');
  rect(m,5,15,20,15,'^');
  rect(m,6,14,7,14,'h');put(m,7,13,'^');
  rect(m,9,12,10,12,'h');put(m,10,11,'^');
  rect(m,12,10,13,10,'h');put(m,13,9,'^');
  rect(m,15,8,16,8,'h');put(m,16,7,'^');
  rect(m,18,6,19,6,'h');put(m,19,5,'^');
  rect(m,21,6,28,14,'#');put(m,24,5,'a');put(m,27,5,'b');
 }),
 mkLv('Двое во тьме','Всё сразу: коробка и ворота, рычаг и лифт, а наверху — мост из света над шипами.',1,m=>{
  put(m,1,15,'1');put(m,2,15,'2');
  rect(m,3,14,6,15,'#');put(m,5,13,'o');put(m,7,15,'k');
  rect(m,11,1,11,11,'#');rect(m,11,12,11,15,'G');
  put(m,13,15,'l');
  rect(m,18,7,20,8,'#');rect(m,26,7,28,8,'#');
  rect(m,21,15,25,15,'^');
  put(m,22,7,'h');put(m,24,6,'h');
  put(m,27,6,'a');put(m,28,6,'b');
 },{mov:[{c:16,r:15,w:2,dx:0,dy:-8,sw:1}]}),
 mkLv('Две дороги','Белый не пройдёт сквозь тень. Чёрный по верхнему ярусу дёргает рычаг, чтобы белый переплыл шипы, потом держит кнопку, пока белый проходит ворота внизу.',0,m=>{
  put(m,3,7,'1');put(m,4,7,'2');
  rect(m,2,8,13,9,'#');
  rect(m,14,1,14,6,'#');put(m,14,7,'x');rect(m,14,8,14,9,'#');
  rect(m,15,8,28,9,'#');
  put(m,6,7,'l');put(m,16,7,'^');put(m,19,7,'k');put(m,27,7,'a');
  rect(m,6,15,11,15,'^');
  rect(m,21,10,21,11,'#');rect(m,21,12,21,15,'G');
  put(m,24,15,'b');
 },{mov:[{c:6,r:14,w:3,dx:3,dy:0,sw:1}]}),
 mkLv('Свет не держит','Белый держит световой мост, пока рядом. Переведите белого на ту сторону, поставьте коробку на мост и отойдите: мост пропадёт, и коробка упадёт на кнопку.',1,m=>{
  put(m,1,15,'1');put(m,2,15,'2');
  rect(m,3,14,6,15,'#');put(m,4,13,'o');
  put(m,7,15,'k');put(m,8,15,'^');
  rect(m,7,14,8,14,'h');
  rect(m,9,14,12,15,'#');
  rect(m,16,1,16,11,'#');rect(m,16,12,16,15,'G');
  put(m,17,15,'l');rect(m,18,15,24,15,'^');
  put(m,26,15,'a');put(m,28,15,'b');
 },{mov:[{c:18,r:14,w:3,dx:4,dy:0,sw:1}]}),
 mkLv('Ночной переход','Рычаг запускает платформу над шипами, дальше — лестница света, на каждой ступени шип. Белый ведёт, чёрный следом.',1,m=>{
  put(m,1,15,'1');put(m,2,15,'2');put(m,3,15,'l');
  rect(m,5,15,22,15,'^');
  rect(m,15,13,16,13,'h');put(m,16,12,'^');
  rect(m,18,11,19,11,'h');put(m,19,10,'^');
  rect(m,21,9,22,9,'h');put(m,22,8,'^');
  rect(m,24,9,28,14,'#');
  put(m,25,8,'a');put(m,27,8,'b');
 },{mov:[{c:5,r:14,w:3,dx:5,dy:0,sw:1}]}),
 mkLv('Первый дождь','Сверху падают шипы. Эмиттер краснеет перед падением — отступите в сторону. Платформа везёт вас под дождём.',0,m=>{
  put(m,1,15,'1');put(m,2,15,'2');put(m,4,15,'l');
  rect(m,6,15,24,15,'^');
  put(m,26,15,'a');put(m,28,15,'b');
 },{mov:[{c:6,r:14,w:3,dx:16,dy:0,sw:1}],em:[{c:9,r:1,p:100,o:0},{c:13,r:1,p:100,o:25},{c:17,r:1,p:100,o:50},{c:21,r:1,p:100,o:75}]}),
 mkLv('Лифт под дождём','Лифт, платформа над шипами и коробка на кнопке верхнего яруса — и всё это под падающими шипами.',0,m=>{
  put(m,1,15,'1');put(m,2,15,'2');put(m,4,15,'l');
  rect(m,9,7,14,8,'#');rect(m,24,7,28,8,'#');
  put(m,10,6,'o');put(m,12,6,'k');
  rect(m,15,15,23,15,'^');
  rect(m,26,1,26,4,'#');rect(m,26,5,26,6,'G');
  put(m,27,6,'a');put(m,28,6,'b');
 },{mov:[{c:6,r:15,w:3,dx:0,dy:-8,sw:1},{c:15,r:7,w:3,dx:6,dy:0,sw:1}],em:[{c:7,r:1,p:110,o:0},{c:12,r:1,p:90,o:10},{c:17,r:1,p:100,o:0},{c:20,r:1,p:100,o:50},{c:25,r:1,p:100,o:30}]}),
 mkLv('Гроза','Тьма, платформа над шипами, лестница света и шипы с неба. Не задерживайтесь на месте — и держитесь вместе.',1,m=>{
  put(m,1,15,'1');put(m,2,15,'2');put(m,3,15,'l');
  rect(m,5,15,25,15,'^');
  rect(m,15,13,16,13,'h');put(m,16,12,'^');
  rect(m,18,11,19,11,'h');put(m,19,10,'^');
  rect(m,21,9,22,9,'h');put(m,22,8,'^');
  rect(m,24,7,25,7,'h');put(m,25,6,'^');
  rect(m,27,7,28,14,'#');
  put(m,27,6,'a');put(m,28,6,'b');
 },{mov:[{c:5,r:14,w:3,dx:5,dy:0,sw:1}],em:[{c:8,r:1,p:110,o:0},{c:11,r:1,p:110,o:55},{c:17,r:1,p:90,o:20},{c:20,r:1,p:90,o:65},{c:23,r:1,p:90,o:40},{c:26,r:1,p:100,o:0}]})
);
let lv=0,g,B,Wp,gateOpen=false,wait=0,fin=false,t0=0,lever=false,sPrev=false,boxes=[],plats=[],ems=[],drops=[],fc=0;
const keys={};
const net={role:'',room:null,peer:false,snap:null,n:0};
const MAP={ArrowLeft:'KeyA',ArrowRight:'KeyD',ArrowUp:'KeyW',ArrowDown:'KeyS',Space:'KeyW'};
const kc=c=>net.role?(MAP[c]||c):c;
addEventListener('keydown',e=>{keys[kc(e.code)]=true;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(e.code==='KeyR'&&!fin&&net.role!=='guest')load(lv);});
addEventListener('keyup',e=>keys[kc(e.code)]=false);

const mk=(x,y,black)=>({x,y,w:20,h:20,vx:0,vy:0,g:false,black});
function load(n){
 lv=n;wait=0;lever=false;boxes=[];ems=LV[n].ex.em||[];drops=[];fc=0;plats=(LV[n].ex.mov||[]).map(m=>({x:m.c*T,y:m.r*T,w:m.w*T,h:14,ax:m.c*T,ay:m.r*T,bx:(m.c+m.dx)*T,by:(m.r+m.dy)*T,t:0,dir:1,sw:!!m.sw}));
 g=LV[n].rows.map(r=>r.padEnd(W,'.').slice(0,W).split(''));
 for(let r=0;r<H;r++)for(let c=0;c<W;c++){
  if(r===0||r===H-1||c===0||c===W-1)g[r][c]='#';
  const ch=g[r][c];
  if(ch==='1'){B=mk(c*T+6,r*T+T-20,true);g[r][c]='.';}
  if(ch==='2'){Wp=mk(c*T+6,r*T+T-20,false);g[r][c]='.';}
  if(ch==='o'){boxes.push({x:c*T,y:r*T,w:T,h:T,vx:0,vy:0,g:false,box:1});g[r][c]='.';}
 }
}
function lit(c,r){
 const dx=(c+.5)*T-(Wp.x+10),dy=(r+.5)*T-(Wp.y+10);
 return dx*dx+dy*dy<R*R;
}
function solid(c,r,p){
 const t=g[r][c];
 if(t==='#')return true;
 if(t==='x')return !p.black;
 if(t==='G')return !gateOpen;
 if(t==='g')return !lever;
 if(t==='h')return lit(c,r);
 return false;
}
function collide(p,hx){
 const x0=Math.floor(p.x/T),x1=Math.floor((p.x+p.w-.01)/T),y0=Math.floor(p.y/T),y1=Math.floor((p.y+p.h-.01)/T);
 for(let r=y0;r<=y1;r++)for(let c=x0;c<=x1;c++){
  if(!solid(c,r,p))continue;
  if(hx){if(p.vx>0)p.x=c*T-p.w;else if(p.vx<0)p.x=(c+1)*T;p.vx=0;}
  else{if(p.vy>0){p.y=r*T-p.h;p.g=true;}else if(p.vy<0)p.y=(r+1)*T;p.vy=0;}
 }
}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function move(p){
 const o=plats.concat(boxes.filter(b=>b!==p));
 p.x+=p.vx;collide(p,true);
 for(const e of o)if(hit(p,e)){
  if(e.box&&!p.box&&p.vx){const x0=e.x;e.x+=p.vx;e.vx=p.vx;collide(e,true);e.vx=0;
   if(o.some(f=>f!==e&&f.box&&hit(e,f))||hit(e,B===p?Wp:B))e.x=x0;}
  if(hit(p,e))p.x=p.vx>0?e.x-p.w:e.x+e.w;
 }
 p.g=false;p.ride=null;p.y+=p.vy;collide(p,false);
 for(const e of o)if(hit(p,e)){
  if(p.vy>=0){p.y=e.y-p.h;p.g=true;p.vy=0;p.ride=e;}
  else{p.y=e.y+e.h;p.vy=0;}
 }
}
function movePlats(){
 for(const e of plats){
  if(e.sw&&!lever)continue;
  const len=Math.hypot(e.bx-e.ax,e.by-e.ay);
  e.t+=1.3/len*e.dir;
  if(e.t>=1||e.t<=0){e.t=Math.max(0,Math.min(1,e.t));e.dir*=-1;}
  const nx=e.ax+(e.bx-e.ax)*e.t,ny=e.ay+(e.by-e.ay)*e.t,dx=nx-e.x,dy=ny-e.y;
  for(const q of [B,Wp,...boxes])if(q.ride===e){q.x+=dx;q.y+=dy;}
  e.x=nx;e.y=ny;
 }
}
function touches(p,ch){
 const i=ch==='^'?8:0;
 const x0=Math.floor(p.x/T),x1=Math.floor((p.x+p.w-.01)/T),y0=Math.floor(p.y/T),y1=Math.floor((p.y+p.h-.01)/T);
 for(let r=y0;r<=y1;r++)for(let c=x0;c<=x1;c++){
  if(g[r][c]!==ch)continue;
  if(p.x<c*T+T-i&&p.x+p.w>c*T+i&&p.y<r*T+T&&p.y+p.h>r*T+i)return true;
 }
 return false;
}
function ctl(p,l,r,u){
 const d=(keys[r]?1:0)-(keys[l]?1:0);
 p.vx+=(d*3.3-p.vx)*.4;
 if(keys[u]&&p.g)p.vy=-10.5;
}
// Падающие шипы: эмиттеры {c,r,p,o} — колонка, строка, период в кадрах, сдвиг.
// За 45 кадров до падения эмиттер краснеет. Шип гибельный для огоньков, исчезает у стены, платформы или коробки.
function rain(){
 fc++;
 for(const e of ems)if((fc+e.o)%e.p===0)drops.push({x:e.c*T+10,y:e.r*T+T,w:12,h:16,vy:0});
 const hp=(p,d)=>p.x<d.x+d.w&&p.x+p.w>d.x&&p.y<d.y+d.h&&p.y+p.h>d.y;
 const nd=[];
 for(const d of drops){
  d.vy=Math.min(d.vy+.35,8);d.y+=d.vy;
  if(hp(B,d)||hp(Wp,d))return true;
  const c=Math.floor((d.x+d.w/2)/T),r=Math.floor((d.y+d.h)/T);
  if(r>=H||solid(c,r,{black:false}))continue;
  if(plats.some(e=>hit(d,e))||boxes.some(b=>hit(d,b)))continue;
  nd.push(d);
 }
 drops=nd;return false;
}
function step(){
 t0++;
 if(net.role==='guest'){lerpAll();return;}
 if(wait>0){wait--;if(wait===0){if(lv+1<LV.length)load(lv+1);else fin=true;}return;}
 if(fin)return;
 gateOpen=touches(B,'k')||boxes.some(b=>touches(b,'k'));
 const sk=!!keys.KeyS;if(sk&&!sPrev&&touches(B,'l'))lever=!lever;sPrev=sk;
 movePlats();
 ctl(B,'KeyA','KeyD','KeyW');
 ctl(Wp,'ArrowLeft','ArrowRight','ArrowUp');
 for(const p of [...boxes,B,Wp]){p.vy=Math.min(p.vy+.5,12);move(p);}
 if(rain()||touches(B,'^')||touches(Wp,'^')){load(lv);return;}
 if(touches(B,'a')&&touches(Wp,'b'))wait=50;
}

function glow(c,x,y,r,a){
 const gr=c.createRadialGradient(x,y,r*.25,x,y,r);
 gr.addColorStop(0,'rgba(0,0,0,'+a+')');gr.addColorStop(1,'rgba(0,0,0,0)');
 c.fillStyle=gr;c.beginPath();c.arc(x,y,r,0,7);c.fill();
}
function ring(x,y,col){
 ctx.strokeStyle=col;ctx.lineWidth=3;
 ctx.beginPath();ctx.arc(x+T/2,y+T/2,11+Math.sin(t0/12)*1.5,0,7);ctx.stroke();
}
function wisp(p){
 const cx=p.x+10,cy=p.y+9+Math.sin(t0/10+(p.black?0:2))*1.2;
 const gr=ctx.createRadialGradient(cx,cy,4,cx,cy,26);
 gr.addColorStop(0,p.black?'rgba(150,110,255,.5)':'rgba(255,248,210,.7)');gr.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=gr;ctx.beginPath();ctx.arc(cx,cy,26,0,7);ctx.fill();
 ctx.fillStyle=p.black?'#07070d':'#fffbea';
 ctx.strokeStyle=p.black?'#a98bff':'#ffe9a0';ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(cx,cy,11,0,7);ctx.fill();ctx.stroke();
 ctx.fillStyle=p.black?'#fffbea':'#201a33';
 ctx.fillRect(cx-5,cy-3,3,5);ctx.fillRect(cx+2,cy-3,3,5);
}
function draw(){
 ctx.fillStyle='#12142a';ctx.fillRect(0,0,cv.width,cv.height);
 for(let r=0;r<H;r++)for(let c=0;c<W;c++){
  const t=g[r][c],x=c*T,y=r*T;
  if(t==='#'){ctx.fillStyle='#2a2d4d';ctx.fillRect(x,y,T,T);ctx.strokeStyle='#3a3f6c';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,T-1,T-1);}
  else if(t==='x'){ctx.fillStyle='rgba(120,70,210,.5)';ctx.fillRect(x,y,T,T);ctx.strokeStyle='#8a5cf0';ctx.strokeRect(x+2,y+2,T-4,T-4);}
  else if(t==='G'){ctx.fillStyle=gateOpen?'rgba(240,170,60,.15)':'#e8a13a';ctx.fillRect(x+9,y,14,T);}
  else if(t==='k'){ctx.fillStyle=gateOpen?'#ffd98a':'#9a6a22';ctx.fillRect(x+4,y+T-8,T-8,8);}
  else if(t==='g'){ctx.fillStyle=lever?'rgba(90,190,255,.15)':'#3fa9e0';ctx.fillRect(x+9,y,14,T);}
  else if(t==='l'){ctx.fillStyle='#6b5a2a';ctx.fillRect(x+8,y+T-6,16,6);ctx.strokeStyle=lever?'#7bd5ff':'#b5b5c5';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+16,y+T-6);ctx.lineTo(x+(lever?26:6),y+8);ctx.stroke();}
  else if(t==='^'){ctx.fillStyle='#e0505f';ctx.beginPath();ctx.moveTo(x+3,y+T);ctx.lineTo(x+T/2,y+8);ctx.lineTo(x+T-3,y+T);ctx.fill();}
  else if(t==='a')ring(x,y,'#9d7cff');
  else if(t==='b')ring(x,y,'#fff1b8');
  else if(t==='h'&&lit(c,r)){ctx.fillStyle='rgba(255,243,176,.85)';ctx.fillRect(x,y,T,T);}
 }
 for(const e of plats){ctx.fillStyle='#7d85c9';ctx.fillRect(e.x,e.y,e.w,e.h);}
 for(const b of boxes){ctx.fillStyle='#8a6a3b';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle='#c49a5a';ctx.lineWidth=2;ctx.strokeRect(b.x+2,b.y+2,b.w-4,b.h-4);}
 if(LV[lv].dark){
  dctx.globalCompositeOperation='source-over';
  dctx.fillStyle='rgba(2,3,9,.97)';dctx.fillRect(0,0,dk.width,dk.height);
  dctx.globalCompositeOperation='destination-out';
  glow(dctx,Wp.x+10,Wp.y+10,R,1);glow(dctx,B.x+10,B.y+10,R*.28,.9);
  ctx.drawImage(dk,0,0);
 }
 for(const e of ems){
  const ph=(fc+e.o)%e.p,w=ph>e.p-45?(ph-(e.p-45))/45:0,x=e.c*T,y=e.r*T;
  ctx.fillStyle='#4a4d70';ctx.fillRect(x+6,y,20,10);
  ctx.fillStyle='rgba(255,'+Math.round(110-80*w)+',100,'+(.4+.6*w)+')';
  ctx.beginPath();ctx.moveTo(x+10,y+10);ctx.lineTo(x+22,y+10);ctx.lineTo(x+16,y+18+8*w);ctx.fill();
 }
 for(const d of drops){ctx.fillStyle='#ff5a6a';ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+d.w,d.y);ctx.lineTo(d.x+d.w/2,d.y+d.h);ctx.fill();}
 wisp(B);wisp(Wp);
 ctx.fillStyle='#a8abc8';ctx.font='16px Georgia,serif';ctx.textAlign='left';
 ctx.fillText('Уровень '+(lv+1)+' из '+LV.length+': '+LV[lv].name,40,26);
 ctx.fillStyle='#8f93b0';ctx.font='14px Georgia,serif';
 ctx.fillText(LV[lv].hint,40,H*T-40);
 if(wait>0||fin){
  ctx.fillStyle='rgba(8,9,20,.7)';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#fff1b8';ctx.font='32px Georgia,serif';ctx.textAlign='center';
  ctx.fillText(fin?'Все уровни пройдены':'Уровень пройден',cv.width/2,cv.height/2);
 }
}
const R2=n=>Math.round(n*10)/10;
function sendSnap(){
 net.room.emit('snap',{l:lv,b:[R2(B.x),R2(B.y)],w:[R2(Wp.x),R2(Wp.y)],o:boxes.map(b=>[R2(b.x),R2(b.y)]),p:plats.map(e=>[R2(e.x),R2(e.y)]),v:lever?1:0,g:gateOpen?1:0,wt:wait,f:fin?1:0,d:drops.map(d=>[R2(d.x),R2(d.y)]),fc}).catch(()=>{});
}
let lastI=-1,lastT=0;
function sendInp(){
 const i=(keys.KeyA?1:0)+(keys.KeyD?2:0)+(keys.KeyW?4:0),now=performance.now();
 if(i!==lastI||now-lastT>150){lastI=i;lastT=now;net.room.emit('inp',{i}).catch(()=>{});}
}
function lerpAll(){
 const s=net.snap;if(!s)return;
 if(s.l!==lv)load(s.l);
 lever=!!s.v;gateOpen=!!s.g;wait=s.wt;fin=!!s.f;
 drops=(s.d||[]).map(a=>({x:a[0],y:a[1],w:12,h:16}));fc=s.fc||0;
 const f=(o,t)=>{o.x+=(t[0]-o.x)*.4;o.y+=(t[1]-o.y)*.4;};
 f(B,s.b);f(Wp,s.w);
 s.o.forEach((t,i)=>boxes[i]&&f(boxes[i],t));
 s.p.forEach((t,i)=>plats[i]&&f(plats[i],t));
}
const ABLY_KEY='BuaNjw.wvk6OA:BbLljLhlL6wbLlCv20OFj8vfR8kBdIqb72IK8cq0XeQ';
function mkRoom(code){
 const id=Math.random().toString(36).slice(2),hs={};
 const ab=new Ably.Realtime({key:ABLY_KEY,echoMessages:false});
 const ch=ab.channels.get('twowisps-'+code);
 ch.subscribe('m',msg=>{const m=msg.data;if(!m||m.f===id)return;(hs[m.t]||[]).forEach(h=>h({isMe:false,data:m.d}));});
 return{
  ready:()=>new Promise((ok,no)=>{
   if(ab.connection.state==='connected')return ok();
   ab.connection.once('connected',ok);
   ab.connection.once('failed',()=>no({type:'ably-failed'}));
   setTimeout(()=>no({type:'timeout'}),15000);
  }),
  emit(t,d){try{const p=ch.publish('m',{t,d,f:id});if(p&&p.catch)p.catch(()=>{});}catch(e){}return Promise.resolve();},
  on(t,h){(hs[t]=hs[t]||[]).push(h);}
 };
}
async function goOnline(role,code){
 if(net.role)return;
 const st=document.getElementById('st');
 if(ABLY_KEY.indexOf('ВСТАВЬТЕ')>=0){st.textContent='В файле не вписан ключ Ably (ABLY_KEY).';return;}
 try{
  const rm=mkRoom(code);net.room=rm;
  await rm.ready();
 }catch(e){const ty=(e&&(e.type||e.code))||'ошибка';st.textContent='Нет связи с сервером Ably ('+ty+'): проверьте ключ и интернет.';net.room=null;return;}
 net.role=role;net.peer=false;net.snap=null;
 net.room.on('inp',m=>{
  if(m.isMe||net.role!=='host')return;
  const d=m.data||{};
  keys.ArrowLeft=!!(d.i&1);keys.ArrowRight=!!(d.i&2);keys.ArrowUp=!!(d.i&4);
  if(!net.peer){net.peer=true;st.textContent='Игра идёт. Вы — чёрный: A / D, W — прыжок, S — рычаг (можно и стрелками).';}
 });
 net.room.on('snap',m=>{if(m.isMe||net.role!=='guest')return;if(!net.snap)st.textContent='Подключено. Вы — белый: стрелки или WASD.';net.snap=m.data;});
 if(role==='guest')setTimeout(()=>{if(net.role==='guest'&&!net.snap)st.textContent='Хост не отвечает: проверьте код. Хост должен нажать «Создать комнату» и не закрывать вкладку.';},8000);
 load(0);
 st.textContent=role==='host'?'Код комнаты: '+code.toUpperCase()+'. Скажите его второму игроку и ждите…':'Подключаемся к хосту… Вы — белый: стрелки или WASD.';
}
let last=0,acc=0;
function frame(t){acc+=Math.min(t-last,100);last=t;while(acc>=16.67){step();acc-=16.67;}if(net.role==='host'&&net.peer&&++net.n%4===0)sendSnap();
 if(net.role==='guest')sendInp();
 draw();requestAnimationFrame(frame);}
load(0);
document.getElementById('bh').onclick=()=>goOnline('host',Math.random().toString(36).slice(2,6).padEnd(4,'x'));
document.getElementById('bj').onclick=()=>{
 const c=document.getElementById('ci').value.trim().toLowerCase();
 if(/^[a-z0-9]{3,8}$/.test(c))goOnline('guest',c);
 else document.getElementById('st').textContent='Введите код комнаты от хоста.';
};
requestAnimationFrame(t=>{last=t;frame(t);});
</script>
</body>
